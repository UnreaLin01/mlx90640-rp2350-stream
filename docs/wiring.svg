<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .h1   { font-size: 24px; font-weight: 650; fill: #1d2733; }
    .h2   { font-size: 13.5px; fill: #6b7787; }
    .name { font-size: 16px; font-weight: 600; fill: #1d2733; }
    .sub  { font-size: 12px; fill: #8a95a3; }
    .pin  { font-size: 14px; font-weight: 600; fill: #1d2733; }
    .pinn { font-size: 11.5px; fill: #8a95a3; }
    .wl   { font-size: 12.5px; font-weight: 600; }
    .lg   { font-size: 12.5px; fill: #5b6b7f; }
  </style>
  <rect width="1000" height="490" fill="#ffffff"/>

  <text class="h1" x="50" y="44">Wiring</text>
  <text class="h2" x="50" y="68">Four wires between the sensor and the board, nothing else is needed.</text>

  <!-- sensor -->
  <rect x="120" y="104" width="230" height="286" rx="12" fill="#ffffff" stroke="#9db4c9" stroke-width="2"/>
  <text class="name" x="235" y="140" text-anchor="middle">Adafruit MLX90640</text>
  <text class="sub" x="235" y="160" text-anchor="middle">Thermal camera breakout</text>

  <!-- board -->
  <rect x="650" y="104" width="230" height="286" rx="12" fill="#ffffff" stroke="#6f8fae" stroke-width="2"/>
  <text class="name" x="765" y="140" text-anchor="middle">W6300-EVB-Pico2</text>
  <text class="sub" x="765" y="160" text-anchor="middle">RP2350A, Pico form factor</text>

  <!-- 3.3 V -->
  <path d="M350,215 H650" stroke="#d64545" stroke-width="3" fill="none"/>
  <circle cx="350" cy="215" r="6" fill="#d64545"/>
  <circle cx="650" cy="215" r="6" fill="#d64545"/>
  <text class="pin" x="336" y="220" text-anchor="end">VIN</text>
  <text class="pin" x="664" y="212">3V3 OUT</text>
  <text class="pinn" x="664" y="229">physical pin 36</text>
  <text class="wl" x="500" y="206" text-anchor="middle" fill="#d64545">3.3 V power</text>

  <!-- GND -->
  <path d="M350,260 H650" stroke="#3b4350" stroke-width="3" fill="none"/>
  <circle cx="350" cy="260" r="6" fill="#3b4350"/>
  <circle cx="650" cy="260" r="6" fill="#3b4350"/>
  <text class="pin" x="336" y="265" text-anchor="end">GND</text>
  <text class="pin" x="664" y="257">GND</text>
  <text class="pinn" x="664" y="274">physical pin 38</text>
  <text class="wl" x="500" y="251" text-anchor="middle" fill="#3b4350">Common ground</text>

  <!-- SCL -->
  <path d="M350,305 H650" stroke="#c08a1e" stroke-width="3" fill="none"/>
  <circle cx="350" cy="305" r="6" fill="#c08a1e"/>
  <circle cx="650" cy="305" r="6" fill="#c08a1e"/>
  <text class="pin" x="336" y="310" text-anchor="end">SCL</text>
  <text class="pin" x="664" y="302">GP5</text>
  <text class="pinn" x="664" y="319">physical pin 7</text>
  <text class="wl" x="500" y="296" text-anchor="middle" fill="#c08a1e">I2C clock</text>

  <!-- SDA -->
  <path d="M350,350 H650" stroke="#2f6fb5" stroke-width="3" fill="none"/>
  <circle cx="350" cy="350" r="6" fill="#2f6fb5"/>
  <circle cx="650" cy="350" r="6" fill="#2f6fb5"/>
  <text class="pin" x="336" y="355" text-anchor="end">SDA</text>
  <text class="pin" x="664" y="347">GP4</text>
  <text class="pinn" x="664" y="364">physical pin 6</text>
  <text class="wl" x="500" y="341" text-anchor="middle" fill="#2f6fb5">I2C data</text>

  <!-- footer -->
  <text class="lg" x="50" y="440">The board also has GND on pins 3, 8, 13, 18, 23, 28 and 33, so use whichever one is easiest to reach.</text>
  <text class="lg" x="50" y="462">Pull-up resistors for SDA and SCL are already on the sensor module, so nothing else needs to be added.</text>
</svg>
