<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7f"/>
    </marker>
    <style>
      .h1   { font-size: 26px; font-weight: 650; fill: #1d2733; }
      .h2   { font-size: 14px; fill: #6b7787; }
      .lane { font-size: 15px; font-weight: 650; }
      .name { font-size: 15px; font-weight: 600; fill: #1d2733; }
      .t    { font-size: 12.5px; fill: #5b6b7f; }
      .lbl  { font-size: 12.5px; font-weight: 600; fill: #1d4e79; }
      .dim  { font-size: 12.5px; fill: #9aa7b6; }
      .optl { font-size: 12.5px; font-weight: 600; fill: #8a6d1f; }
    </style>
  </defs>
  <rect width="1200" height="960" fill="#ffffff"/>

  <text class="h1" x="60" y="52">硬體架構</text>
  <text class="h2" x="60" y="78">兩種組態的差別只在資料怎麼送到電腦。感測器接法、韌體邏輯與電腦端程式完全一樣。</text>

  <!-- ================= Panel A ================= -->
  <rect x="60" y="104" width="1080" height="330" rx="14" fill="#f7f9fc" stroke="#cfd8e3"/>
  <rect x="60" y="104" width="1080" height="32" rx="14" fill="#e6ebf2"/>
  <rect x="60" y="120" width="1080" height="16" fill="#e6ebf2"/>
  <text class="lane" x="80" y="126" fill="#3d4f63">組態 A　USB 模式　韌體 mlx_thermal　一條 USB 線就能用</text>

  <rect x="88" y="164" width="200" height="116" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="188" y="192" text-anchor="middle">MLX90640</text>
  <text class="t" x="188" y="216" text-anchor="middle">SparkFun 模組</text>
  <text class="t" x="188" y="238" text-anchor="middle">3.3V 供電並且共地</text>
  <text class="t" x="188" y="260" text-anchor="middle">模組自帶上拉電阻</text>

  <rect x="418" y="152" width="344" height="212" rx="12" fill="#ffffff" stroke="#6f8fae" stroke-width="2"/>
  <text class="name" x="590" y="182" text-anchor="middle">W6300-EVB-Pico2</text>
  <rect x="440" y="198" width="300" height="72" rx="8" fill="#eef4fb" stroke="#c7dcf0"/>
  <text class="name" x="590" y="224" text-anchor="middle">RP2350A</text>
  <text class="t" x="590" y="248" text-anchor="middle">雙核心 Cortex-M33．USB 模式只用核心 0</text>
  <rect x="440" y="282" width="300" height="62" rx="8" fill="#f4f6f8" stroke="#dde3ea"/>
  <text class="name" x="590" y="306" text-anchor="middle" fill="#9aa7b6">W6300 乙太網路晶片</text>
  <text class="dim" x="590" y="328" text-anchor="middle">此組態沒有用到，腳位仍保留</text>

  <rect x="892" y="164" width="200" height="116" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="992" y="192" text-anchor="middle">電腦</text>
  <text class="t" x="992" y="216" text-anchor="middle">Windows</text>
  <text class="t" x="992" y="238" text-anchor="middle">執行 viewer.py</text>
  <text class="t" x="992" y="260" text-anchor="middle">自動找到 COM port</text>

  <path d="M288,200 H412" stroke="#5b6b7f" fill="none" marker-end="url(#a2)"/>
  <text class="lbl" x="350" y="190" text-anchor="middle">I2C 1 MHz</text>
  <text class="t" x="350" y="224" text-anchor="middle">SDA 接 GP4</text>
  <text class="t" x="350" y="244" text-anchor="middle">SCL 接 GP5</text>

  <path d="M762,200 H886" stroke="#5b6b7f" fill="none" marker-end="url(#a2)"/>
  <text class="lbl" x="824" y="190" text-anchor="middle">USB CDC</text>
  <text class="t" x="824" y="224" text-anchor="middle">12 Mbps</text>
  <text class="t" x="824" y="244" text-anchor="middle">供電與資料共用</text>
  <text class="t" x="824" y="264" text-anchor="middle">也用來燒錄韌體</text>

  <rect x="88" y="312" width="200" height="92" rx="10" fill="#fffdf6" stroke="#e5d6a8" stroke-dasharray="4 3"/>
  <text class="optl" x="188" y="338" text-anchor="middle">選用　Logic 8</text>
  <text class="t" x="188" y="362" text-anchor="middle">CH0 接 SDA．CH1 接 SCL</text>
  <text class="t" x="188" y="384" text-anchor="middle">CH2 CH3 接計時標記</text>

  <rect x="892" y="312" width="200" height="92" rx="10" fill="#fffdf6" stroke="#e5d6a8" stroke-dasharray="4 3"/>
  <text class="optl" x="992" y="338" text-anchor="middle">選用　J-Link</text>
  <text class="t" x="992" y="362" text-anchor="middle">SWD 燒錄與 RTT log</text>
  <text class="t" x="992" y="384" text-anchor="middle">VTref 要接 3V3</text>

  <path d="M288,352 H412" stroke="#c9b26a" fill="none" stroke-dasharray="5 4"/>
  <path d="M892,352 H768" stroke="#c9b26a" fill="none" stroke-dasharray="5 4"/>

  <!-- ================= Panel B ================= -->
  <rect x="60" y="466" width="1080" height="372" rx="14" fill="#f2faf4" stroke="#bfe3c9"/>
  <rect x="60" y="466" width="1080" height="32" rx="14" fill="#daf0e1"/>
  <rect x="60" y="482" width="1080" height="16" fill="#daf0e1"/>
  <text class="lane" x="80" y="488" fill="#1f6b3a">組態 B　乙太網路模式　韌體 mlx_thermal_udp　網路在核心 1</text>

  <rect x="88" y="530" width="200" height="116" rx="10" fill="#ffffff" stroke="#8fc2a1"/>
  <text class="name" x="188" y="558" text-anchor="middle">MLX90640</text>
  <text class="t" x="188" y="582" text-anchor="middle">接法與組態 A 相同</text>
  <text class="t" x="188" y="604" text-anchor="middle">GP4 與 GP5</text>
  <text class="t" x="188" y="626" text-anchor="middle">3.3V 供電並且共地</text>

  <rect x="418" y="518" width="344" height="230" rx="12" fill="#ffffff" stroke="#4f9268" stroke-width="2"/>
  <text class="name" x="590" y="548" text-anchor="middle">W6300-EVB-Pico2</text>
  <rect x="440" y="564" width="300" height="86" rx="8" fill="#eef4fb" stroke="#c7dcf0"/>
  <text class="name" x="590" y="590" text-anchor="middle">RP2350A</text>
  <text class="t" x="590" y="614" text-anchor="middle">核心 0 讀 I2C</text>
  <text class="t" x="590" y="636" text-anchor="middle">核心 1 跑網路</text>
  <rect x="440" y="662" width="300" height="70" rx="8" fill="#eaf7ee" stroke="#a9d9ba"/>
  <text class="name" x="590" y="686" text-anchor="middle" fill="#1f6b3a">W6300 乙太網路晶片</text>
  <text class="t" x="590" y="710" text-anchor="middle">QSPI 由 PIO 驅動．佔用 GPIO15 到 22</text>

  <rect x="836" y="530" width="140" height="116" rx="10" fill="#ffffff" stroke="#8fc2a1"/>
  <text class="name" x="906" y="558" text-anchor="middle">路由器</text>
  <text class="t" x="906" y="582" text-anchor="middle">192.168.1.1</text>
  <text class="t" x="906" y="604" text-anchor="middle">DHCP 伺服器</text>
  <text class="t" x="906" y="626" text-anchor="middle">有線無線同網段</text>

  <rect x="1006" y="530" width="136" height="116" rx="10" fill="#ffffff" stroke="#8fc2a1"/>
  <text class="name" x="1074" y="558" text-anchor="middle">電腦</text>
  <text class="t" x="1074" y="582" text-anchor="middle">沒有網路埠</text>
  <text class="t" x="1074" y="604" text-anchor="middle">靠 Wi-Fi 連線</text>
  <text class="t" x="1074" y="626" text-anchor="middle">viewer.py</text>

  <path d="M288,566 H412" stroke="#5b6b7f" fill="none" marker-end="url(#a2)"/>
  <text class="lbl" x="350" y="556" text-anchor="middle">I2C 1 MHz</text>

  <path d="M762,566 H830" stroke="#5b6b7f" fill="none" marker-end="url(#a2)"/>
  <path d="M976,566 H1000" stroke="#5b6b7f" fill="none" marker-end="url(#a2)"/>
  <text class="lbl" x="770" y="672">開發板到路由器走網路線，路由器到電腦走 Wi-Fi，使用 UDP 埠 5005</text>

  <rect x="418" y="766" width="344" height="30" rx="8" fill="#fffdf6" stroke="#e5d6a8" stroke-dasharray="4 3"/>
  <text class="t" x="590" y="786" text-anchor="middle" fill="#8a6d1f">USB 線仍接著，但只負責供電</text>

  <text class="t" x="770" y="702">實測頻寬 35 Mbit/s，串流只用掉約 0.43 Mbit/s</text>
  <text class="t" x="770" y="724">延遲抖動主要來自 Wi-Fi 那一段，不是開發板</text>
  <text class="t" x="770" y="746">開發板先向路由器要 IP，要不到才用 192.168.1.200</text>
  <text class="t" x="770" y="768">電腦會自動找到開發板，不必手動設定位址</text>

  <!-- footer -->
  <text class="name" x="60" y="880">兩種組態的共通之處</text>
  <text class="t" x="60" y="906">感測器接線、I2C 時序、封包格式、電腦端的解析與顯示程式都完全相同，切換模式只要燒不同韌體，電腦端加上 --source 參數即可。</text>
  <text class="t" x="60" y="930">GP6 與 GP7 的計時標記在兩種組態都保留，隨時可以接 Logic 8 量測；J-Link 也可以隨時接上讀取 RTT log。</text>
</svg>
