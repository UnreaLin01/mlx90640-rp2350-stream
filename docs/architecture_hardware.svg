<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7f"/>
    </marker>
    <style>
      .h1   { font-size: 26px; font-weight: 650; fill: #1d2733; }
      .h2   { font-size: 14px; fill: #6b7787; }
      .lane { font-size: 15px; font-weight: 650; }
      .name { font-size: 15px; font-weight: 600; fill: #1d2733; }
      .t    { font-size: 12.5px; fill: #5b6b7f; }
      .lbl  { font-size: 12.5px; font-weight: 600; fill: #1d4e79; }
      .dim  { font-size: 12.5px; fill: #9aa7b6; }
      .optl { font-size: 12.5px; font-weight: 600; fill: #8a6d1f; }
    </style>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>

  <text class="h1" x="50" y="50">Hardware setup</text>
  <text class="h2" x="50" y="76">The two configurations differ only in how data reaches the PC. Sensor wiring, firmware logic and PC software stay the same.</text>

  <!-- ===== Configuration A ===== -->
  <rect x="50" y="100" width="1100" height="300" rx="14" fill="#f7f9fc" stroke="#cfd8e3"/>
  <rect x="50" y="100" width="1100" height="32" rx="14" fill="#e6ebf2"/>
  <rect x="50" y="116" width="1100" height="16" fill="#e6ebf2"/>
  <text class="lane" x="72" y="122" fill="#3d4f63">Configuration A — USB mode — firmware mlx_thermal — one cable does everything</text>

  <rect x="78" y="160" width="210" height="120" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="183" y="188" text-anchor="middle">MLX90640</text>
  <text class="t" x="183" y="212" text-anchor="middle">Adafruit module</text>
  <text class="t" x="183" y="234" text-anchor="middle">3.3 V, common ground</text>
  <text class="t" x="183" y="256" text-anchor="middle">Pull-ups on the module</text>

  <rect x="420" y="148" width="360" height="216" rx="12" fill="#ffffff" stroke="#6f8fae" stroke-width="2"/>
  <text class="name" x="600" y="178" text-anchor="middle">W6300-EVB-Pico2</text>
  <rect x="444" y="194" width="312" height="76" rx="8" fill="#eef4fb" stroke="#c7dcf0"/>
  <text class="name" x="600" y="220" text-anchor="middle">RP2350A</text>
  <text class="t" x="600" y="244" text-anchor="middle">Dual core Cortex-M33, only core 0 used</text>
  <rect x="444" y="284" width="312" height="64" rx="8" fill="#f4f6f8" stroke="#dde3ea"/>
  <text class="name" x="600" y="308" text-anchor="middle" fill="#9aa7b6">W6300 Ethernet chip</text>
  <text class="dim" x="600" y="330" text-anchor="middle">Not used here, pins still reserved</text>

  <rect x="912" y="160" width="210" height="120" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="1017" y="188" text-anchor="middle">PC</text>
  <text class="t" x="1017" y="212" text-anchor="middle">Windows</text>
  <text class="t" x="1017" y="234" text-anchor="middle">Runs viewer.py</text>
  <text class="t" x="1017" y="256" text-anchor="middle">Finds the COM port</text>

  <path d="M288,200 H414" stroke="#5b6b7f" fill="none" marker-end="url(#a2)"/>
  <text class="lbl" x="351" y="190" text-anchor="middle">I2C at 1 MHz</text>
  <text class="t" x="351" y="224" text-anchor="middle">SDA on GP4</text>
  <text class="t" x="351" y="244" text-anchor="middle">SCL on GP5</text>

  <path d="M780,200 H906" stroke="#5b6b7f" fill="none" marker-end="url(#a2)"/>
  <text class="lbl" x="843" y="190" text-anchor="middle">USB CDC</text>
  <text class="t" x="843" y="224" text-anchor="middle">12 Mbps</text>
  <text class="t" x="843" y="244" text-anchor="middle">Power and data</text>
  <text class="t" x="843" y="264" text-anchor="middle">Also used to flash</text>

  <rect x="912" y="300" width="210" height="76" rx="10" fill="#fffdf6" stroke="#e5d6a8" stroke-dasharray="4 3"/>
  <text class="optl" x="1017" y="326" text-anchor="middle">Optional — J-Link</text>
  <text class="t" x="1017" y="348" text-anchor="middle">SWD flashing and RTT log</text>
  <text class="t" x="1017" y="368" text-anchor="middle">Connect VTref to 3V3</text>

  <path d="M906,338 H784" stroke="#c9b26a" fill="none" stroke-dasharray="5 4"/>

  <!-- ===== Configuration B ===== -->
  <rect x="50" y="430" width="1100" height="340" rx="14" fill="#f2faf4" stroke="#bfe3c9"/>
  <rect x="50" y="430" width="1100" height="32" rx="14" fill="#daf0e1"/>
  <rect x="50" y="446" width="1100" height="16" fill="#daf0e1"/>
  <text class="lane" x="72" y="452" fill="#1f6b3a">Configuration B — Ethernet mode — firmware mlx_thermal_udp — network on core 1</text>

  <rect x="78" y="490" width="210" height="120" rx="10" fill="#ffffff" stroke="#8fc2a1"/>
  <text class="name" x="183" y="518" text-anchor="middle">MLX90640</text>
  <text class="t" x="183" y="542" text-anchor="middle">Wired exactly as in A</text>
  <text class="t" x="183" y="564" text-anchor="middle">GP4 and GP5</text>
  <text class="t" x="183" y="586" text-anchor="middle">3.3 V, common ground</text>

  <rect x="420" y="478" width="360" height="232" rx="12" fill="#ffffff" stroke="#4f9268" stroke-width="2"/>
  <text class="name" x="600" y="508" text-anchor="middle">W6300-EVB-Pico2</text>
  <rect x="444" y="524" width="312" height="88" rx="8" fill="#eef4fb" stroke="#c7dcf0"/>
  <text class="name" x="600" y="550" text-anchor="middle">RP2350A</text>
  <text class="t" x="600" y="574" text-anchor="middle">Core 0 reads I2C</text>
  <text class="t" x="600" y="596" text-anchor="middle">Core 1 runs the network</text>
  <rect x="444" y="626" width="312" height="72" rx="8" fill="#eaf7ee" stroke="#a9d9ba"/>
  <text class="name" x="600" y="650" text-anchor="middle" fill="#1f6b3a">W6300 Ethernet chip</text>
  <text class="t" x="600" y="674" text-anchor="middle">QSPI driven by PIO, GPIO15 to GPIO22</text>

  <rect x="846" y="490" width="130" height="120" rx="10" fill="#ffffff" stroke="#8fc2a1"/>
  <text class="name" x="911" y="518" text-anchor="middle">Router</text>
  <text class="t" x="911" y="542" text-anchor="middle">192.168.1.1</text>
  <text class="t" x="911" y="564" text-anchor="middle">DHCP server</text>
  <text class="t" x="911" y="586" text-anchor="middle">Same subnet</text>

  <rect x="1006" y="490" width="130" height="120" rx="10" fill="#ffffff" stroke="#8fc2a1"/>
  <text class="name" x="1071" y="518" text-anchor="middle">PC</text>
  <text class="t" x="1071" y="542" text-anchor="middle">No Ethernet port</text>
  <text class="t" x="1071" y="564" text-anchor="middle">Wi-Fi only</text>
  <text class="t" x="1071" y="586" text-anchor="middle">viewer.py</text>

  <path d="M288,530 H414" stroke="#5b6b7f" fill="none" marker-end="url(#a2)"/>
  <text class="lbl" x="351" y="520" text-anchor="middle">I2C at 1 MHz</text>

  <path d="M780,530 H840" stroke="#5b6b7f" fill="none" marker-end="url(#a2)"/>
  <path d="M976,530 H1000" stroke="#5b6b7f" fill="none" marker-end="url(#a2)"/>

  <text class="t" x="800" y="650">Board to router over Ethernet, router to PC over Wi-Fi</text>
  <text class="t" x="800" y="672">UDP port 5005, the stream uses 0.43 of the 35 Mbit/s measured</text>
  <text class="t" x="800" y="694">Jitter comes from the Wi-Fi hop, not from the board</text>
  <text class="t" x="800" y="716">DHCP first, 192.168.1.200 as fallback, the PC finds the board</text>

  <rect x="420" y="726" width="360" height="30" rx="8" fill="#fffdf6" stroke="#e5d6a8" stroke-dasharray="4 3"/>
  <text class="t" x="600" y="746" text-anchor="middle" fill="#8a6d1f">USB cable still plugged in, for power only</text>

  <!-- ===== Footer ===== -->
  <text class="name" x="50" y="822">What both configurations share</text>
  <text class="t" x="50" y="848">Sensor wiring, I2C timing, packet format and PC software are identical. Switching mode means flashing a different firmware and adding --source on the PC.</text>
  <text class="t" x="50" y="870">Both firmwares send a status packet once a second, so the PC can check the link without any debug hardware attached.</text>
</svg>
