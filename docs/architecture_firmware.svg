<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7f"/>
    </marker>
    <style>
      .h1   { font-size: 26px; font-weight: 650; fill: #1d2733; }
      .h2   { font-size: 14px; fill: #6b7787; }
      .lane { font-size: 15px; font-weight: 650; }
      .name { font-size: 15px; font-weight: 600; fill: #1d2733; }
      .t    { font-size: 12.5px; fill: #5b6b7f; }
      .lbl  { font-size: 12.5px; font-weight: 600; fill: #1d4e79; }
    </style>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>

  <text class="h1" x="50" y="50">Firmware architecture</text>
  <text class="h2" x="50" y="76">Data flow and core split. Core 0 only reads the sensor; all network waiting happens on core 1.</text>

  <!-- ===== Lane: core 0 ===== -->
  <rect x="50" y="100" width="1100" height="192" rx="14" fill="#eef4fb" stroke="#c7dcf0"/>
  <rect x="50" y="100" width="1100" height="34" rx="14" fill="#d7e8f7"/>
  <rect x="50" y="118" width="1100" height="16" fill="#d7e8f7"/>
  <text class="lane" x="72" y="122" fill="#1d4e79">Core 0 — sensor loop</text>
  <text class="t" x="1128" y="122" text-anchor="end" fill="#1d4e79">One subpage every 32 ms, 17.5 ms spent reading</text>

  <rect x="78" y="152" width="188" height="110" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="172" y="180" text-anchor="middle">MLX90640</text>
  <text class="t" x="172" y="206" text-anchor="middle">32 x 24 pixels</text>
  <text class="t" x="172" y="228" text-anchor="middle">32 subpages per second</text>

  <rect x="292" y="152" width="188" height="110" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="386" y="180" text-anchor="middle">i2c_bus.c</text>
  <text class="t" x="386" y="206" text-anchor="middle">I2C at 1 MHz on GP4 GP5</text>
  <text class="t" x="386" y="228" text-anchor="middle">Two DMA channels</text>
  <text class="t" x="386" y="250" text-anchor="middle">No gap between bytes</text>

  <rect x="506" y="152" width="188" height="110" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="600" y="180" text-anchor="middle">sensor.c</text>
  <text class="t" x="600" y="206" text-anchor="middle">Melexis reference flow</text>
  <text class="t" x="600" y="228" text-anchor="middle">Waits for data ready flag</text>
  <text class="t" x="600" y="250" text-anchor="middle">Reads 832 words at once</text>

  <rect x="720" y="152" width="188" height="110" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="814" y="180" text-anchor="middle">stream.c</text>
  <text class="t" x="814" y="206" text-anchor="middle">Adds header and CRC-32</text>
  <text class="t" x="814" y="228" text-anchor="middle">Splits 1666 bytes into</text>
  <text class="t" x="814" y="250" text-anchor="middle">two packets</text>

  <rect x="934" y="152" width="188" height="110" rx="10" fill="#fff6ea" stroke="#e8b877"/>
  <text class="name" x="1028" y="180" text-anchor="middle">transport_send</text>
  <text class="t" x="1028" y="206" text-anchor="middle">Returns immediately</text>
  <text class="t" x="1028" y="228" text-anchor="middle">Drops the whole packet</text>
  <text class="t" x="1028" y="250" text-anchor="middle">if the queue is full</text>

  <path d="M268,206 H286" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M482,206 H500" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M696,206 H714" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M910,206 H928" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>

  <!-- ===== Transport cards ===== -->
  <path d="M1028,262 V322 H310 V350" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M1028,322 H890 V350" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>

  <rect x="50" y="356" width="520" height="225" rx="14" fill="#f7f9fc" stroke="#cfd8e3"/>
  <rect x="50" y="356" width="520" height="32" rx="14" fill="#e6ebf2"/>
  <rect x="50" y="372" width="520" height="16" fill="#e6ebf2"/>
  <text class="lane" x="72" y="378" fill="#3d4f63">USB mode — mlx_thermal — single core</text>

  <rect x="74" y="406" width="472" height="76" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="310" y="434" text-anchor="middle">transport_usb.c — TinyUSB CDC</text>
  <text class="t" x="310" y="458" text-anchor="middle">Writes to the FIFO and returns. Image data only, never logs.</text>

  <rect x="74" y="498" width="472" height="76" rx="10" fill="#ffffff" stroke="#cfd8e3"/>
  <text class="name" x="310" y="526" text-anchor="middle">USB background work</text>
  <text class="t" x="310" y="550" text-anchor="middle">Runs while waiting for the sensor and DMA. Costs no extra time.</text>

  <rect x="630" y="356" width="520" height="225" rx="14" fill="#f2faf4" stroke="#bfe3c9"/>
  <rect x="630" y="356" width="520" height="32" rx="14" fill="#daf0e1"/>
  <rect x="630" y="372" width="520" height="16" fill="#daf0e1"/>
  <text class="lane" x="652" y="378" fill="#1f6b3a">Ethernet mode — mlx_thermal_udp — dual core</text>

  <rect x="654" y="406" width="226" height="168" rx="10" fill="#ffffff" stroke="#8fc2a1"/>
  <text class="name" x="767" y="434" text-anchor="middle">queue_t ring</text>
  <text class="t" x="767" y="458" text-anchor="middle">16 slots of 1054 bytes</text>
  <text class="t" x="767" y="478" text-anchor="middle">Guarded by a hardware</text>
  <text class="t" x="767" y="498" text-anchor="middle">spin lock</text>
  <text class="t" x="767" y="524" text-anchor="middle">Core 0 pushes</text>
  <text class="t" x="767" y="544" text-anchor="middle">Core 1 pops</text>
  <text class="t" x="767" y="564" text-anchor="middle">Both may run at once</text>

  <rect x="900" y="406" width="226" height="168" rx="10" fill="#ffffff" stroke="#8fc2a1"/>
  <text class="name" x="1013" y="434" text-anchor="middle">Core 1 — net_task</text>
  <text class="t" x="1013" y="458" text-anchor="middle">W6300 over QSPI</text>
  <text class="t" x="1013" y="478" text-anchor="middle">Driven by PIO and DMA</text>
  <text class="t" x="1013" y="498" text-anchor="middle">DHCP first, then static IP</text>
  <text class="t" x="1013" y="524" text-anchor="middle">Learns the PC address</text>
  <text class="t" x="1013" y="544" text-anchor="middle">from a REQUEST packet</text>
  <text class="t" x="1013" y="564" text-anchor="middle">Sends UDP, may wait on ARP</text>

  <path d="M884,490 H896" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>

  <!-- ===== Why two cores ===== -->
  <rect x="230" y="600" width="740" height="82" rx="10" fill="#fff6ea" stroke="#e8b877"/>
  <text class="name" x="254" y="626">Why the network gets its own core</text>
  <text class="t" x="254" y="650">Network calls block: waiting for the link, about 78 ms for an ARP reply, or for a DHCP server.</text>
  <text class="t" x="254" y="670">Core 0 keeps reading the sensor and never waits on any of that.</text>

  <path d="M110,581 V704" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <text class="lbl" x="122" y="648">USB CDC</text>
  <path d="M1090,581 V704" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <text class="lbl" x="1078" y="648" text-anchor="end">UDP packets</text>

  <!-- ===== Lane: PC ===== -->
  <rect x="50" y="712" width="1100" height="162" rx="14" fill="#faf7fd" stroke="#d9cbe8"/>
  <rect x="50" y="712" width="1100" height="30" rx="14" fill="#ece2f5"/>
  <rect x="50" y="727" width="1100" height="15" fill="#ece2f5"/>
  <text class="lane" x="72" y="733" fill="#5b3a86">PC side — one program for both modes, only the data source changes</text>

  <rect x="78" y="764" width="188" height="88" rx="10" fill="#ffffff" stroke="#bfa8d9"/>
  <text class="name" x="172" y="792" text-anchor="middle">sources.py</text>
  <text class="t" x="172" y="816" text-anchor="middle">COM port or UDP</text>
  <text class="t" x="172" y="836" text-anchor="middle">Finds the board for you</text>

  <rect x="292" y="764" width="188" height="88" rx="10" fill="#ffffff" stroke="#bfa8d9"/>
  <text class="name" x="386" y="792" text-anchor="middle">protocol.py</text>
  <text class="t" x="386" y="816" text-anchor="middle">Finds magic, checks CRC</text>
  <text class="t" x="386" y="836" text-anchor="middle">Resyncs after a glitch</text>

  <rect x="506" y="764" width="188" height="88" rx="10" fill="#ffffff" stroke="#bfa8d9"/>
  <text class="name" x="600" y="792" text-anchor="middle">blocks.py</text>
  <text class="t" x="600" y="816" text-anchor="middle">Reassembles the parts</text>
  <text class="t" x="600" y="836" text-anchor="middle">Checks sequence numbers</text>

  <rect x="720" y="764" width="188" height="88" rx="10" fill="#ffffff" stroke="#bfa8d9"/>
  <text class="name" x="814" y="792" text-anchor="middle">calc_python.py</text>
  <text class="t" x="814" y="816" text-anchor="middle">Converts to temperature</text>
  <text class="t" x="814" y="836" text-anchor="middle">numpy implementation</text>

  <rect x="934" y="764" width="188" height="88" rx="10" fill="#ffffff" stroke="#bfa8d9"/>
  <text class="name" x="1028" y="792" text-anchor="middle">viewer.py</text>
  <text class="t" x="1028" y="816" text-anchor="middle">Live thermal image</text>
  <text class="t" x="1028" y="836" text-anchor="middle">Stream statistics</text>

  <path d="M268,808 H286" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M482,808 H500" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M696,808 H714" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M910,808 H928" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
</svg>
