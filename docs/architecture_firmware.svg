<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7f"/>
    </marker>
    <style>
      .h1    { font-size: 26px; font-weight: 650; fill: #1d2733; }
      .h2    { font-size: 14px; fill: #6b7787; }
      .lane  { font-size: 15px; font-weight: 650; }
      .name  { font-size: 15px; font-weight: 600; fill: #1d2733; }
      .t     { font-size: 12.5px; fill: #5b6b7f; }
      .lbl   { font-size: 12.5px; font-weight: 600; fill: #1d4e79; }
    </style>
  </defs>
  <rect width="1200" height="940" fill="#ffffff"/>

  <text class="h1" x="60" y="52">韌體執行架構</text>
  <text class="h2" x="60" y="78">資料流與核心分工。核心 0 專心讀感測器，網路的等待都交給核心 1。</text>

  <!-- ========== Lane: core 0 ========== -->
  <rect x="60" y="104" width="1080" height="216" rx="14" fill="#eef4fb" stroke="#c7dcf0"/>
  <rect x="60" y="104" width="1080" height="32" rx="14" fill="#d7e8f7"/>
  <rect x="60" y="120" width="1080" height="16" fill="#d7e8f7"/>
  <text class="lane" x="80" y="126" fill="#1d4e79">核心 0　感測器迴圈</text>
  <text class="t" x="1120" y="126" text-anchor="end" fill="#1d4e79">每 32 ms 一個 subpage，讀取佔用 17.5 ms</text>

  <rect x="80" y="156" width="190" height="104" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="175" y="184" text-anchor="middle">MLX90640</text>
  <text class="t" x="175" y="208" text-anchor="middle">32 × 24 像素</text>
  <text class="t" x="175" y="228" text-anchor="middle">每秒 32 個 subpage</text>

  <rect x="295" y="156" width="190" height="104" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="390" y="184" text-anchor="middle">i2c_bus.c</text>
  <text class="t" x="390" y="208" text-anchor="middle">I2C 1 MHz．GP4 GP5</text>
  <text class="t" x="390" y="228" text-anchor="middle">兩條 DMA 通道</text>
  <text class="t" x="390" y="248" text-anchor="middle">位元組之間無空檔</text>

  <rect x="510" y="156" width="190" height="104" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="605" y="184" text-anchor="middle">sensor.c</text>
  <text class="t" x="605" y="208" text-anchor="middle">Melexis 官方讀法</text>
  <text class="t" x="605" y="228" text-anchor="middle">等待新資料旗標</text>
  <text class="t" x="605" y="248" text-anchor="middle">832 words 一次讀完</text>

  <rect x="725" y="156" width="190" height="104" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="820" y="184" text-anchor="middle">stream.c</text>
  <text class="t" x="820" y="208" text-anchor="middle">加標頭與 CRC-32</text>
  <text class="t" x="820" y="228" text-anchor="middle">1666 bytes 切成</text>
  <text class="t" x="820" y="248" text-anchor="middle">兩個封包</text>

  <rect x="940" y="156" width="190" height="104" rx="10" fill="#fff6ea" stroke="#e8b877"/>
  <text class="name" x="1035" y="184" text-anchor="middle">transport_send</text>
  <text class="t" x="1035" y="208" text-anchor="middle">立刻返回，不等待</text>
  <text class="t" x="1035" y="228" text-anchor="middle">塞不下就整包丟棄</text>
  <text class="t" x="1035" y="248" text-anchor="middle">並且計數</text>

  <text class="t" x="80" y="292">計時標記給 Logic 8 量測：GP6 在讀取期間維持高電位，GP7 每收到一個新 subpage 翻轉一次</text>

  <path d="M270,208 H289" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M485,208 H504" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M700,208 H719" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M915,208 H934" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>

  <!-- ========== Lane: transports ========== -->
  <text class="lane" x="60" y="358" fill="#1d2733">傳輸層　同一組介面兩種實作，編譯時擇一，封包格式完全相同</text>

  <!-- USB card -->
  <rect x="60" y="376" width="500" height="232" rx="14" fill="#f7f9fc" stroke="#cfd8e3"/>
  <rect x="60" y="376" width="500" height="30" rx="14" fill="#e6ebf2"/>
  <rect x="60" y="391" width="500" height="15" fill="#e6ebf2"/>
  <text class="lane" x="80" y="397" fill="#3d4f63">USB 模式　韌體 mlx_thermal　單核心</text>

  <rect x="84" y="428" width="452" height="72" rx="10" fill="#ffffff" stroke="#9db4c9"/>
  <text class="name" x="310" y="456" text-anchor="middle">transport_usb.c　TinyUSB CDC</text>
  <text class="t" x="310" y="480" text-anchor="middle">資料寫進 FIFO 就返回，USB 通道只傳影像資料</text>

  <rect x="84" y="516" width="452" height="72" rx="10" fill="#ffffff" stroke="#cfd8e3"/>
  <text class="name" x="310" y="544" text-anchor="middle">USB 背景工作</text>
  <text class="t" x="310" y="568" text-anchor="middle">在等待感測器與等待 DMA 的空檔執行，不另外佔時間</text>

  <!-- Ethernet card -->
  <rect x="600" y="376" width="540" height="232" rx="14" fill="#f2faf4" stroke="#bfe3c9"/>
  <rect x="600" y="376" width="540" height="30" rx="14" fill="#daf0e1"/>
  <rect x="600" y="391" width="540" height="15" fill="#daf0e1"/>
  <text class="lane" x="620" y="397" fill="#1f6b3a">乙太網路模式　韌體 mlx_thermal_udp　雙核心</text>

  <rect x="624" y="428" width="228" height="160" rx="10" fill="#ffffff" stroke="#8fc2a1"/>
  <text class="name" x="738" y="456" text-anchor="middle">queue_t 佇列</text>
  <text class="t" x="738" y="482" text-anchor="middle">16 格，每格 1054 bytes</text>
  <text class="t" x="738" y="504" text-anchor="middle">硬體 spin lock 保護</text>
  <text class="t" x="738" y="526" text-anchor="middle">核心 0 放入</text>
  <text class="t" x="738" y="548" text-anchor="middle">核心 1 取出</text>
  <text class="t" x="738" y="570" text-anchor="middle">兩邊可同時存取</text>

  <rect x="888" y="428" width="228" height="160" rx="10" fill="#ffffff" stroke="#8fc2a1"/>
  <text class="name" x="1002" y="456" text-anchor="middle">核心 1　net_task</text>
  <text class="t" x="1002" y="482" text-anchor="middle">W6300 走 QSPI</text>
  <text class="t" x="1002" y="504" text-anchor="middle">由 PIO 與 DMA 驅動</text>
  <text class="t" x="1002" y="526" text-anchor="middle">先試 DHCP 再用固定 IP</text>
  <text class="t" x="1002" y="548" text-anchor="middle">收 REQUEST 學電腦位址</text>
  <text class="t" x="1002" y="570" text-anchor="middle">送出 UDP，可能等 ARP</text>

  <path d="M852,508 H882" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>

  <path d="M1035,260 V336 H520 V422" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M1035,260 V336 H738 V422" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>

  <!-- why two cores -->
  <rect x="210" y="624" width="780" height="72" rx="10" fill="#fff6ea" stroke="#e8b877"/>
  <text class="name" x="234" y="652">為什麼網路要獨立一顆核心</text>
  <text class="t" x="234" y="676">網路呼叫會停住，例如等網路線接上、等 ARP 回應約 78 毫秒、等 DHCP 伺服器回應。</text>
  <text class="t" x="234" y="690" opacity="0">placeholder</text>

  <!-- ========== Lane: PC ========== -->
  <rect x="60" y="724" width="1080" height="160" rx="14" fill="#faf7fd" stroke="#d9cbe8"/>
  <rect x="60" y="724" width="1080" height="30" rx="14" fill="#ece2f5"/>
  <rect x="60" y="739" width="1080" height="15" fill="#ece2f5"/>
  <text class="lane" x="80" y="745" fill="#5b3a86">電腦端　兩種模式共用同一套程式，只換資料來源</text>

  <rect x="80" y="776" width="190" height="86" rx="10" fill="#ffffff" stroke="#bfa8d9"/>
  <text class="name" x="175" y="804" text-anchor="middle">sources.py</text>
  <text class="t" x="175" y="828" text-anchor="middle">COM port 或 UDP</text>
  <text class="t" x="175" y="848" text-anchor="middle">自動搜尋開發板</text>

  <rect x="295" y="776" width="190" height="86" rx="10" fill="#ffffff" stroke="#bfa8d9"/>
  <text class="name" x="390" y="804" text-anchor="middle">protocol.py</text>
  <text class="t" x="390" y="828" text-anchor="middle">找 magic 驗 CRC</text>
  <text class="t" x="390" y="848" text-anchor="middle">錯位時重新同步</text>

  <rect x="510" y="776" width="190" height="86" rx="10" fill="#ffffff" stroke="#bfa8d9"/>
  <text class="name" x="605" y="804" text-anchor="middle">blocks.py</text>
  <text class="t" x="605" y="828" text-anchor="middle">分段組回區塊</text>
  <text class="t" x="605" y="848" text-anchor="middle">檢查序號連續</text>

  <rect x="725" y="776" width="190" height="86" rx="10" fill="#ffffff" stroke="#bfa8d9"/>
  <text class="name" x="820" y="804" text-anchor="middle">calc_python.py</text>
  <text class="t" x="820" y="828" text-anchor="middle">換算成溫度</text>
  <text class="t" x="820" y="848" text-anchor="middle">numpy 實作</text>

  <rect x="940" y="776" width="190" height="86" rx="10" fill="#ffffff" stroke="#bfa8d9"/>
  <text class="name" x="1035" y="804" text-anchor="middle">viewer.py</text>
  <text class="t" x="1035" y="828" text-anchor="middle">即時熱影像</text>
  <text class="t" x="1035" y="848" text-anchor="middle">與串流統計</text>

  <path d="M270,819 H289" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M485,819 H504" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M700,819 H719" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <path d="M915,819 H934" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>

  <path d="M120,608 V712" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <text class="lbl" x="132" y="666">USB CDC</text>
  <path d="M1100,608 V712" stroke="#5b6b7f" fill="none" marker-end="url(#arw)"/>
  <text class="lbl" x="1088" y="666" text-anchor="end">UDP 封包</text>
</svg>
